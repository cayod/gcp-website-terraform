name: apply

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      project_id:
        type: string
        required: true
      workload_identity_provider:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: 1.16.4
  TF_IN_AUTOMATION: "true"

jobs:
  apply:
    name: Apply ${{ matrix.stack }} in ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # The environment gates the job and scopes the OIDC subject that the apply identity trusts.
    environment: ${{ inputs.environment }}
    concurrency:
      group: apply-${{ inputs.environment }}-${{ matrix.stack }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        stack: [gcs, mig]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: terraform-apply@${{ inputs.project_id }}.iam.gserviceaccount.com

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Apply
        run: make apply ENV=${{ inputs.environment }} STACK=${{ matrix.stack }} APPLY_ARGS="-auto-approve -no-color"

      - name: Smoke test
        run: make smoke-test ENV=${{ inputs.environment }} STACK=${{ matrix.stack }}
