name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.16.4
  TF_IN_AUTOMATION: "true"

jobs:
  checks:
    name: Static checks and module tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The binary scans every commit; the action scans a commit range that breaks on a branch's first push.
      - name: Scan the full history for secrets
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          git --redact --verbose /repo

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: make fmt-check

      - name: Validate root modules
        run: make validate

      - name: Run module tests
        run: make test

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1

      - name: Lint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"

      - name: Scan for misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"

  plan:
    name: Plan ${{ matrix.stack }} in ${{ matrix.environment }}
    needs: checks
    # Forks never receive credentials: their tokens are rejected by the Workload Identity provider.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
        stack: [gcs, mig]
    env:
      PROJECT_ID: ${{ matrix.environment == 'prod' && vars.PROD_PROJECT_ID || vars.DEV_PROJECT_ID }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ matrix.environment == 'prod' && vars.PROD_WORKLOAD_IDENTITY_PROVIDER || vars.DEV_WORKLOAD_IDENTITY_PROVIDER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: terraform-plan@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # The plan identity is read-only, so the plan cannot take the state lock.
      - name: Plan
        run: |
          make plan ENV=${{ matrix.environment }} STACK=${{ matrix.stack }} \
            PLAN_ARGS="-lock=false -no-color" | tee plan.txt
          {
            echo "### Plan: ${{ matrix.stack }} in ${{ matrix.environment }}"
            echo '```'
            grep -E '^(  # |Plan:|No changes)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
