<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website on Google Cloud</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: Canvas;
      color: CanvasText;
    }
    main { max-width: 36rem; padding: 2rem; }
    h1 { margin: 0 0 1rem; font-size: 1.75rem; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.5rem 1.5rem; }
    dt { opacity: 0.7; }
    dd { margin: 0; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Hello from Google Cloud</h1>
    <p>This page is provisioned with Terraform and redeployed by GitHub Actions on every change.</p>
    <dl>
      <dt>Environment</dt>
      <dd>${environment}</dd>
      <dt>Hosting approach</dt>
      <dd>${approach}</dd>
    </dl>
  </main>
</body>
</html>
